highlight_help_title = "高亮规则说明"
highlight_help_content = '''右键点击规则行可在界面中直接编辑该条规则。
高亮规则格式说明：
每行一条规则。逗号分隔各个部分：
  · 词语... : 匹配标签（多个词语间为「或」关系，匹配任一即应用）
  · bg:#颜色 : 背景色，如 bg:#ff0000
  · fg:#颜色 : 文字色，如 fg:#ffffff
  · b:0/1 : 加粗，1=加粗
  · partial:0/1 : 匹配模式，0=完整词边界（默认），1=子串匹配
  · cs:0/1 : 大小写，0=忽略大小写（默认），1=区分大小写
多条规则按顺序匹配，先匹配的先应用。
示例：
  ori,bg:#777700,fg:#ffff00
  girl,bg:#0066cc,fg:#ffffff,b:1
  1girl,partial:1'''
