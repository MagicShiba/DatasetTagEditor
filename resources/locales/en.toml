highlight_help = "Help"
highlight_help_title = "Highlight Rules Help"
highlight_help_content = '''Right-click a rule line to edit it directly in the UI.
Highlight rule format:
One rule per line. Separate parts with commas:
  · word... : tag to match (multiple words are "OR" — any match applies)
  · bg:#color : background color, e.g. bg:#ff0000
  · fg:#color : text color, e.g. fg:#ffffff
  · b:0/1 : bold, 1=bold
  · partial:0/1 : match mode, 0=whole word (default), 1=substring
  · cs:0/1 : case sensitivity, 0=ignore case (default), 1=case sensitive
Rules are applied in order; the first match wins.
Examples:
  ori,bg:#777700,fg:#ffff00
  girl,bg:#0066cc,fg:#ffffff,b:1
  1girl,partial:1'''
